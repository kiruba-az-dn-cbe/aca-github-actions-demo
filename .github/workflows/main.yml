name: Build and Deploy to Azure Container Apps

on:
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: acagithubdemo12nov
  CONTAINER_APP_NAME: aca-github-demo
  RESOURCE_GROUP: rg-aca-github-demo
  
jobs:

  build-and-deploy:

    runs-on: ubuntu-latest
    steps:
    
       - uses: actions/checkout@v4

       - uses: actions/setup-dotnet@v4
         with:
           dotnet-version: "8.0.x"

       - run: dotnet build ContainerAppDemo/ContainerAppDemo.csproj

       
      
